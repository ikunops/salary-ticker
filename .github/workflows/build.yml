name: build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # 测试先行：打包前必须全部通过
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 运行测试套件
        run: |
          node test-core.js
          node test-breaks.js
          node test-dom.js
          node test-settings.js
          node test-timeline.js
          node test-nightshift.js
          node test-natural.js
          node test-structure.js

  build-mac:
    needs: test
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.arch == 'arm64' && 'aarch64-apple-darwin' || 'x86_64-apple-darwin' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: 安装依赖
        run: npm ci
      - name: 生成页面与图标
        run: |
          mkdir -p src
          cp index.html src/index.html
          node make-tauri-icons.js
      - name: 打包 macOS
        run: npx tauri build --target ${{ matrix.arch == 'arm64' && 'aarch64-apple-darwin' || 'x86_64-apple-darwin' }}
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: mac-${{ matrix.arch }}
          path: |
            .cargo-target/**/release/bundle/dmg/*.dmg
            .cargo-target/**/release/bundle/macos/*.app

  build-win:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: 安装依赖
        run: npm ci
      - name: 生成页面与图标
        run: |
          mkdir -p src
          cp index.html src/index.html
          node make-tauri-icons.js
      - name: 打包 Windows
        run: npx tauri build
        env:
          CARGO_TARGET_DIR: .cargo-target
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: win-x64
          path: |
            .cargo-target/release/*.exe
            .cargo-target/release/bundle/nsis/*.exe
