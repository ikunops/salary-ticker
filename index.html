<!DOCTYPE html>
<html lang="zh-CN" data-mode="dark" data-palette="green">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>工资秒表 · 实时薪资</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23070a10'/%3E%3Ctext x='32' y='45' font-size='38' font-family='system-ui' font-weight='700' text-anchor='middle' fill='%233ddc97'%3E%C2%A5%3C/text%3E%3C/svg%3E">
<style>
:root{
  color-scheme: dark;
  /* ===== 暗夜模式：底色固定，不随配色主题变化 ===== */
  --bg:#070a10; --panel:rgba(255,255,255,.045); --panel2:rgba(255,255,255,.075);
  --line:rgba(255,255,255,.10); --text:#e8eef7; --muted:#8895ab;
  --warn:#ffb84d; --danger:#ff6b81;
  --radius:18px; --shadow:0 24px 60px rgba(0,0,0,.45);
  --track:rgba(255,255,255,.09);
  --input-bg:#141a25; --input-line:rgba(255,255,255,.16);
  --tl-accent:#57f0b0;
  /* 默认配色：青绿 */
  --accent:#3ddc97; --accent2:#43b3ff;
  --accent-rgb:61,220,151; --accent2-rgb:67,179,255;
  --logo-a:#4ff0ac; --logo-b:#18b47a; --logo-fg:#06281c;
  --glow-a:.16; --glow-b:.14; --glow-c:.06;
}
/* ===== 浅色模式：底色固定 ===== */
html[data-mode="light"]{
  color-scheme: light;
  --bg:#eef3fa; --panel:#ffffff; --panel2:#f6f9fe; --line:rgba(15,30,60,.10);
  --text:#0d1b2a; --muted:#5b6b82;
  --warn:#c07800; --danger:#d84359; --shadow:0 18px 40px rgba(20,40,80,.12);
  --track:rgba(15,30,60,.09);
  --input-bg:#ffffff; --input-line:rgba(15,30,60,.18);
  --tl-accent:#1fbf85;
  --glow-a:.13; --glow-b:.12; --glow-c:.04;
}

/* ===== 配色主题：只改强调色，不改底色 =====
   青绿（默认，见 :root） / 红橙 —— 两套都定义在暗夜与浅色之上 */
html[data-palette="red"]{
  --accent:#bb112b;        /* 人民币 100 元券主色调 */
  --accent2:#e8661f;       /* 橙金辅助色 */
  --accent-rgb:187,17,43;
  --accent2-rgb:232,102,31;
  --logo-a:#e0223f; --logo-b:#8e0c20; --logo-fg:#fff2f0;
  --tl-accent:#f0425a;
}
html[data-mode="light"][data-palette="red"]{
  --accent:#bb112b; --accent2:#d4520f;
  --accent-rgb:187,17,43; --accent2-rgb:212,82,15;
  --logo-a:#d01f3c; --logo-b:#8e0c20; --logo-fg:#ffffff;
  --tl-accent:#c9102c;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased; min-height:100%;
  transition:background .3s ease,color .3s ease;
}
body::before{
  content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
  background:
    radial-gradient(900px 520px at 12% -10%, rgba(var(--accent-rgb),var(--glow-a)), transparent 65%),
    radial-gradient(800px 500px at 92% 8%, rgba(var(--accent2-rgb),var(--glow-b)), transparent 62%),
    radial-gradient(700px 700px at 50% 120%, rgba(var(--accent-rgb),var(--glow-c)), transparent 70%);
}
html[data-mode="light"] body::before{
  background:
    radial-gradient(900px 520px at 12% -10%, rgba(var(--accent-rgb),.14), transparent 65%),
    radial-gradient(800px 500px at 92% 8%, rgba(var(--accent2-rgb),.12), transparent 62%);
}
.wrap{max-width:1120px; margin:0 auto; padding:22px clamp(14px,3vw,28px) 40px}

/* ---------- top bar ---------- */
.topbar{display:flex; align-items:center; justify-content:space-between; gap:14px; margin-bottom:18px; flex-wrap:wrap}
.brand{display:flex; align-items:center; gap:12px}
.logo{
  width:42px;height:42px;border-radius:13px;display:grid;place-items:center;
  font-weight:800;font-size:20px;color:var(--logo-fg);
  background:linear-gradient(145deg,var(--logo-a),var(--logo-b));
  box-shadow:0 8px 24px rgba(var(--accent-rgb),.35);
}
.brand h1{margin:0;font-size:17px;letter-spacing:.02em}
.topbar-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.badge{
  display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:999px;
  background:var(--panel);border:1px solid var(--line);font-size:13px;font-weight:600;
  white-space:nowrap;
}
.badge i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:block}
.badge.working{color:var(--accent);border-color:rgba(var(--accent-rgb),.4);background:rgba(var(--accent-rgb),.10)}
.badge.working i{background:var(--accent);box-shadow:0 0 0 0 rgba(var(--accent-rgb),.6);animation:pulse 1.6s infinite}
.badge.break{color:var(--warn);border-color:rgba(255,184,77,.38);background:rgba(255,184,77,.10)}
.badge.break i{background:var(--warn)}
.badge.after{color:var(--accent2);border-color:rgba(var(--accent2-rgb),.38);background:rgba(var(--accent2-rgb),.10)}
.badge.after i{background:var(--accent2)}
.badge.rest{color:var(--muted)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(var(--accent-rgb),.5)}70%{box-shadow:0 0 0 8px rgba(var(--accent-rgb),0)}100%{box-shadow:0 0 0 0 rgba(var(--accent-rgb),0)}}
.clock{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;letter-spacing:.06em}
.icon-btn{
  width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--panel);
  color:var(--text);font-size:17px;cursor:pointer;transition:.18s;line-height:1;
}
.icon-btn:hover{background:var(--panel2);transform:translateY(-1px)}
/* 右上角明暗切换 */
.mode-toggle{width:auto;min-width:76px;padding:0 12px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:600;line-height:1}
.mode-ico{font-size:14px;line-height:1}
.mode-txt{letter-spacing:.02em}

/* ---------- cards ---------- */
.card{
  background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
  box-shadow:var(--shadow); backdrop-filter:blur(14px);
}
.hero{padding:clamp(18px,3vw,30px); margin-bottom:14px; position:relative; overflow:hidden}
.hero::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(560px 200px at 50% -30%, rgba(var(--accent-rgb),.14), transparent 70%);
}
.tabs{display:inline-flex;gap:4px;padding:4px;border-radius:12px;background:var(--track);position:relative;z-index:1}
.tabs button{
  border:0;background:transparent;color:var(--muted);font:inherit;font-size:13px;font-weight:600;
  padding:7px 15px;border-radius:9px;cursor:pointer;transition:.18s;
}
.tabs button.active{background:var(--panel2);color:var(--text);box-shadow:0 2px 10px rgba(0,0,0,.18)}
.amount{
  display:flex;align-items:baseline;gap:2px;margin:18px 0 6px;position:relative;z-index:1;
  font-variant-numeric:tabular-nums;letter-spacing:-.03em;
  font-size:clamp(42px,10.5vw,86px);font-weight:800;line-height:1.02;
  text-shadow:0 0 44px rgba(var(--accent-rgb),.28);
  white-space:nowrap;
}
html[data-mode="light"] .amount{text-shadow:none}
.amount .cur{font-size:.44em;font-weight:700;color:var(--muted);margin-right:6px;letter-spacing:0}
.amount .frac{font-size:.5em;font-weight:700;color:var(--accent);opacity:.95;letter-spacing:-.01em}
#heroInt{background:linear-gradient(160deg,
    color-mix(in srgb,var(--text) 82%, var(--accent)) 0%,
    var(--accent) 78%,
    color-mix(in srgb,var(--accent) 75%, #000) 100%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.hero-sub{color:var(--muted);font-size:13px;position:relative;z-index:1;font-variant-numeric:tabular-nums}
.hero-sub b{color:var(--text);font-weight:600}

/* timeline */
.timeline{margin:20px 0 4px;position:relative;z-index:1}
.tl-track{display:flex;gap:4px;height:12px;border-radius:999px;overflow:hidden;background:transparent}
.tl-seg{position:relative;background:var(--track);border-radius:6px;overflow:hidden;min-width:2px}
.tl-seg .fill{position:absolute;inset:0;width:0%;background:linear-gradient(90deg,rgba(var(--accent-rgb),.55),var(--accent));border-radius:6px;transition:width .25s linear}
.tl-seg.done .fill{width:100%!important}
.tl-gap{border-radius:6px;background:repeating-linear-gradient(90deg,var(--track) 0 4px,transparent 4px 9px);min-width:2px}
/* 月/年视图：休息日刻度 */
.tl-off{border-radius:6px;background:var(--track);opacity:.4;min-width:2px}
/* 月视图：每个日期一格，横向填充，高度与今日视图一致 */
.tl-track.cal{height:12px;gap:2px;overflow:hidden}
.tl-track.cal .tl-seg,.tl-track.cal .tl-off{
  border-radius:3px;min-width:0;background:var(--track);
  box-shadow:inset 0 0 0 1px rgba(127,140,160,.18);
  position:relative;overflow:hidden;height:100%;
}
.tl-track.cal .tl-off{opacity:.5}
.tl-track.cal .tl-seg .fill{
  position:absolute;left:0;top:0;bottom:0;
  height:100%!important;width:0%;border-radius:3px;
  background:linear-gradient(90deg,rgba(var(--accent-rgb),.6),var(--accent));
  transition:width .25s linear;
}
/* 年视图：12 个月，一格一月，横向填充 */
.tl-track.year{height:12px;gap:4px;overflow:hidden}
.tl-track.year .tl-seg{
  border-radius:4px;min-width:0;height:100%;background:var(--track);
  box-shadow:inset 0 0 0 1px rgba(127,140,160,.18);
  position:relative;overflow:hidden;
}
.tl-track.year .tl-seg .fill{
  position:absolute;left:0;top:0;bottom:0;
  height:100%!important;width:0%;border-radius:4px;
  background:linear-gradient(90deg,rgba(var(--accent-rgb),.6),var(--accent));
  transition:width .25s linear;
}
.tl-labels{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:7px;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.tl-labels span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-labels span:first-child,.tl-labels span:last-child{flex:0 0 auto}
.tl-labels span:nth-child(2){flex:1 1 auto;text-align:center;min-width:0}
.hero-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;flex-wrap:wrap;position:relative;z-index:1}
.chip{
  display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;
  background:var(--panel2);border:1px solid var(--line);font-size:12.5px;color:var(--muted);
}
.chip:empty{display:none}
/* 换算标签组 */
.conv-chips{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}
.conv-chips .chip{
  font-variant-numeric:tabular-nums;color:var(--text);
  background:var(--panel2);border:1px solid var(--line);
  animation:convIn .3s ease both;
}
.conv-chips .chip b{color:var(--accent);font-weight:700}
.conv-chips .chip .ico{font-size:13px;line-height:1}
@keyframes convIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media(max-width:640px){.conv-chips{justify-content:flex-start}}

/* 设置里的换算物品列表：单列，保证名称、单价、单位互不挤压 */
.conv-list{display:grid;grid-template-columns:1fr;gap:7px}
.conv-item{
  display:flex;align-items:center;gap:7px;padding:7px 9px;border-radius:11px;
  border:1px solid var(--input-line);background:var(--input-bg);transition:.16s;
  min-width:0;
}
.conv-item.on{border-color:rgba(var(--accent-rgb),.55);background:rgba(var(--accent-rgb),.10)}
.conv-item .tick{
  width:22px;height:22px;flex:0 0 22px;border-radius:7px;border:1px solid var(--input-line);
  background:transparent;display:grid;place-items:center;font-size:12px;color:transparent;
  cursor:pointer;transition:.16s;
}
.conv-item.on .tick{background:var(--accent);border-color:var(--accent);color:#06281c}
.conv-item .emo{font-size:15px;line-height:1;flex:0 0 16px;text-align:center}
.conv-item .cname{
  flex:1 1 auto;min-width:0;font-size:13px;font-weight:600;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;
}
.conv-item .cprice{
  width:62px;flex:0 0 62px;font:inherit;font-size:13px;text-align:right;color:var(--text);
  background:transparent;border:1px solid transparent;border-radius:7px;padding:4px 6px;outline:none;
  font-variant-numeric:tabular-nums;
}
.conv-item .cprice:hover{border-color:var(--input-line)}
.conv-item .cprice:focus{border-color:var(--accent);background:var(--bg)}
.conv-item .unit{
  flex:0 0 40px;font-size:11px;color:var(--muted);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;
}
.conv-item .del{
  width:20px;height:20px;flex:0 0 20px;border:0;background:transparent;color:var(--muted);
  cursor:pointer;font-size:13px;line-height:1;border-radius:5px;
}
.conv-item .del:hover{color:var(--danger)}

/* grid */
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:520px){.grid{grid-template-columns:1fr}}
.stat{padding:16px 17px}
.stat h3{margin:0 0 12px;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.06em}
.kv{display:flex;align-items:baseline;justify-content:space-between;gap:8px;font-size:13.5px;padding:4px 0}
.kv span:first-child{color:var(--muted)}
.kv span:last-child{font-variant-numeric:tabular-nums;font-weight:600}
.kv.big{padding:0 0 6px}
.kv.big span:last-child{font-size:22px;font-weight:800;letter-spacing:-.01em}
.bar{height:8px;border-radius:999px;background:var(--track);overflow:hidden;margin:10px 0 8px}
.bar > i{display:block;height:100%;width:0%;border-radius:999px;background:linear-gradient(90deg,var(--accent2),var(--accent));transition:width .3s linear}
.bar.alt > i{background:linear-gradient(90deg,var(--accent2),var(--accent))}
.mini{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

/* 底部三个汇总卡片 */
.chips-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:12px}
@media(max-width:640px){.chips-row{grid-template-columns:1fr}}
.mchip{
  text-align:left;cursor:pointer;font:inherit;color:inherit;
  background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px 16px;
  transition:.18s;box-shadow:var(--shadow);
}
.mchip:hover{background:var(--panel2);transform:translateY(-2px)}
.mchip small{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
.mchip b{font-size:19px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}

footer{margin-top:18px;text-align:center;font-size:12px;color:var(--muted);line-height:1.9}
footer kbd{
  font:inherit;font-size:11px;padding:2px 6px;border-radius:5px;background:var(--track);
  border:1px solid var(--line);
}

/* ---------- drawer ---------- */
.mask{
  position:fixed;inset:0;background:rgba(2,6,12,.55);backdrop-filter:blur(2px);
  opacity:0;pointer-events:none;transition:.25s;z-index:40;
}
.mask.on{opacity:1;pointer-events:auto}
.drawer{
  position:fixed;top:0;right:0;height:100%;width:min(460px,100vw);z-index:50;
  background:color-mix(in srgb,var(--bg) 92%, var(--panel));border-left:1px solid var(--line);
  transform:translateX(102%);transition:transform .28s cubic-bezier(.4,0,.2,1);
  display:flex;flex-direction:column;box-shadow:-20px 0 60px rgba(0,0,0,.4);
  overflow-x:hidden;
}
.drawer.on{transform:translateX(0)}
.drawer-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--line)}
.drawer-head h2{margin:0;font-size:15px}
/* 只允许纵向滚动，横向一律裁掉（不再出现横向滑块） */
.drawer-body{
  overflow-y:auto;overflow-x:hidden;padding:6px 20px 26px;flex:1;
  min-width:0;
}
.drawer-body > *{min-width:0;max-width:100%}
.field{padding:14px 0;border-bottom:1px solid var(--line)}
.field:last-child{border-bottom:0}
.field > label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:9px;letter-spacing:.03em}
.input,select,textarea{
  width:100%;font:inherit;font-size:14px;color:var(--text);background:var(--input-bg);
  border:1px solid var(--input-line);border-radius:11px;padding:10px 12px;outline:none;transition:.18s;
}
.input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(var(--accent-rgb),.16)}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
textarea{resize:vertical;min-height:66px;font-size:13px;line-height:1.7;font-family:ui-monospace,Consolas,monospace}
.row{display:flex;gap:9px;align-items:center}
.row .input{flex:1;min-width:0}

/* 时间选择器：不依赖浏览器默认图标着色，改用自带 SVG 图标，深浅色都必然可见 */
.time-wrap{position:relative;flex:1 1 0;min-width:0;display:flex}
.time-input{
  flex:1 1 auto;width:100%;min-width:0;font:inherit;font-size:13.5px;color:var(--text);
  background-color:var(--input-bg);border:1px solid var(--input-line);border-radius:10px;
  padding:9px 38px 9px 10px;outline:none;transition:.18s;
  -webkit-appearance:none;appearance:none;
  cursor:pointer;position:relative;
}
.time-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(var(--accent-rgb),.18)}
/* 右侧时钟按钮：整个图标区域（38px 宽、撑满高度）都可点击打开选择器 */
.time-btn{
  position:absolute;top:1px;right:1px;bottom:1px;width:36px;
  display:grid;place-items:center;cursor:pointer;
  border:0;background:transparent;border-radius:0 9px 9px 0;
  color:var(--muted);transition:.16s;padding:0;
}
.time-btn:hover{background:rgba(127,127,127,.16);color:var(--text)}
.time-btn svg{width:15px;height:15px;display:block;pointer-events:none}
html[data-mode="dark"] .time-btn{color:#aab6c8}
html[data-mode="light"] .time-btn{color:#5b6b82}
/* 用原生热区覆盖整个输入框，使"点时间文字也能弹出选择器" */
.time-input::-webkit-calendar-picker-indicator{
  position:absolute;inset:0;width:100%;height:100%;margin:0;padding:0;
  cursor:pointer;opacity:0;
}
/* 原生时间文本强制使用主题前景色（部分浏览器默认灰字看不清） */
.time-input::-webkit-datetime-edit,
.time-input::-webkit-datetime-edit-fields-wrapper,
.time-input::-webkit-datetime-edit-text,
.time-input::-webkit-datetime-edit-hour-field,
.time-input::-webkit-datetime-edit-minute-field,
.time-input::-webkit-datetime-edit-second-field{
  color:var(--text);padding:0;
}
.time-input::-webkit-datetime-edit-fields-wrapper{background:transparent}
.time-input::-webkit-datetime-edit-hour-field:focus,
.time-input::-webkit-datetime-edit-minute-field:focus{
  background:rgba(var(--accent-rgb),.22);color:var(--text);border-radius:4px;
}

.seg-row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.seg-row .dash{color:var(--muted);font-size:12px;flex:0 0 auto}
.seg-del{
  width:32px;height:32px;flex:0 0 32px;border-radius:9px;border:1px solid var(--line);
  background:transparent;color:var(--muted);cursor:pointer;font-size:15px;line-height:1;
}
.seg-del:hover{color:var(--danger);border-color:rgba(255,107,129,.5)}
.btn{
  font:inherit;font-size:13px;font-weight:600;padding:9px 14px;border-radius:11px;cursor:pointer;
  border:1px dashed var(--line);background:transparent;color:var(--muted);width:100%;
}
.btn:hover{color:var(--accent);border-color:rgba(var(--accent-rgb),.5)}
.btn.solid{border:1px solid var(--line);border-style:solid;background:var(--panel2);color:var(--text)}
.btn.solid:hover{color:var(--danger);border-color:rgba(255,107,129,.5)}
.week{display:flex;gap:6px}
.week button{
  flex:1;padding:9px 0;border-radius:10px;border:1px solid var(--line);background:transparent;
  color:var(--muted);font:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:.16s;
}
.week button.on{background:rgba(var(--accent-rgb),.14);border-color:rgba(var(--accent-rgb),.5);color:var(--accent)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{
  padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:transparent;
  color:var(--muted);font:inherit;font-size:12.5px;font-weight:600;cursor:pointer;transition:.16s;
}
.chips button.on{background:rgba(var(--accent2-rgb),.14);border-color:rgba(var(--accent2-rgb),.5);color:var(--accent2)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.switch:last-child{border-bottom:0}
.switch span{font-size:13.5px}
.hint-muted{font-size:11.5px;color:var(--muted);margin-top:8px;opacity:.85}
.tgl{width:46px;height:26px;border-radius:999px;background:var(--track);border:1px solid var(--line);
  position:relative;cursor:pointer;flex:0 0 46px;transition:.2s}
.tgl::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;
  background:var(--muted);transition:.2s}
.tgl.on{background:rgba(var(--accent-rgb),.25);border-color:rgba(var(--accent-rgb),.5)}
.tgl.on::after{left:22px;background:var(--accent)}
.toast{
  position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);z-index:80;
  background:var(--panel2);border:1px solid var(--line);color:var(--text);
  padding:10px 18px;border-radius:12px;font-size:13px;opacity:0;pointer-events:none;transition:.24s;
  box-shadow:var(--shadow);
}
.toast.on{opacity:1;transform:translate(-50%,0)}
/* 数字输入框的上下箭头在深色下也保持可见 */
.input::-webkit-inner-spin-button{opacity:.55}
html[data-mode="light"] .input::-webkit-inner-spin-button{opacity:.4}

/* ===================== 排行榜面板 ===================== */
.rank-drawer{width:min(420px,100vw)}
.rank-boards{display:flex;gap:6px;margin:4px 0 12px}
.rank-tab{
  flex:1;padding:9px 0;border-radius:10px;border:1px solid var(--line);
  background:transparent;color:var(--muted);font:inherit;font-size:13px;font-weight:600;
  cursor:pointer;transition:.16s;
}
.rank-tab.on{background:rgba(var(--accent-rgb),.14);border-color:rgba(var(--accent-rgb),.5);color:var(--accent)}
.rank-scope{display:flex;gap:6px;margin-bottom:12px}
.rank-scopebtn{
  flex:1;padding:7px 0;border-radius:999px;border:1px solid var(--line);
  background:transparent;color:var(--muted);font:inherit;font-size:12px;font-weight:600;cursor:pointer;transition:.16s;
}
.rank-scopebtn.on{background:rgba(var(--accent2-rgb),.14);border-color:rgba(var(--accent2-rgb),.5);color:var(--accent2)}
.rank-list{display:flex;flex-direction:column;gap:6px}
.rank-row{
  display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;
  background:var(--input-bg);border:1px solid var(--input-line);
}
.rank-row.me{border-color:rgba(var(--accent-rgb),.55);background:rgba(var(--accent-rgb),.10)}
.rank-no{
  width:26px;flex:0 0 26px;text-align:center;font-weight:800;font-size:14px;
  font-variant-numeric:tabular-nums;color:var(--muted);
}
.rank-no.top1{color:#f5c542}
.rank-no.top2{color:#c0c8d4}
.rank-no.top3{color:#cf8b52}
.rank-info{flex:1;min-width:0}
.rank-name{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank-meta{font-size:11px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank-val{text-align:right;flex:0 0 auto;font-variant-numeric:tabular-nums}
.rank-val b{display:block;font-size:14px;font-weight:700;color:var(--accent)}
.rank-val small{font-size:10.5px;color:var(--muted)}
.rank-empty{padding:40px 0;text-align:center;color:var(--muted);font-size:13px;line-height:1.9}
.rank-foot{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted);text-align:center;line-height:1.8}

/* ===================== 移动端适配 ===================== */
@media (max-width:760px){
  .wrap{padding:12px clamp(10px,3vw,16px) calc(20px + env(safe-area-inset-bottom))}
  /* 顶栏：单行紧凑，不换行 */
  .topbar{gap:8px;margin-bottom:12px;flex-wrap:nowrap}
  .logo{width:34px;height:34px;border-radius:10px;font-size:16px}
  .brand h1{font-size:15px}
  .brand{gap:8px;flex:0 1 auto;min-width:0}
  .topbar-right{gap:6px;flex:0 0 auto}
  .badge{padding:5px 9px;font-size:11.5px;gap:5px}
  .badge i{width:6px;height:6px}
  .clock{font-size:11.5px;letter-spacing:0}
  .icon-btn{width:34px;height:34px;border-radius:10px;font-size:15px}
  .mode-toggle{min-width:34px;padding:0 8px}
  .mode-txt{display:none}          /* 手机上只留图标 */
  /* 金额区 */
  .hero{padding:14px}
  .amount{margin:12px 0 4px;font-size:clamp(34px,13.5vw,64px);letter-spacing:-.035em}
  .amount .cur{font-size:.40em;margin-right:3px}
  .amount .frac{font-size:.46em}
  .hero-sub{font-size:12px}
  .timeline{margin:14px 0 2px}
  .tl-track{height:10px;gap:3px}
  .tl-labels{margin-top:5px;font-size:10.5px}
  .hero-foot{margin-top:10px}
  .conv-chips{gap:6px;justify-content:flex-start}
  .conv-chips .chip{padding:5px 9px;font-size:11.5px}
  /* 数据卡：两列更省纵向空间 */
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
  .stat{padding:12px 13px}
  .stat h3{font-size:11px;margin-bottom:9px}
  .kv{font-size:12.5px;padding:3px 0}
  .kv.big span:last-child{font-size:18px}
  .bar{height:6px;margin:8px 0 6px}
  /* 底部三张汇总卡保持一排 */
  .chips-row{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:9px}
  .mchip{padding:10px 11px;border-radius:12px}
  .mchip small{font-size:10.5px;margin-bottom:3px}
  .mchip b{font-size:15px}
  /* 设置抽屉：全屏、大触控区 */
  .drawer{width:100vw;border-left:0}
  .drawer-head{padding:14px 16px}
  .drawer-body{padding:4px 16px 24px}
  .field{padding:12px 0}
  .field > label{font-size:12px;margin-bottom:8px}
  .input,select,textarea{font-size:16px}   /* 16px 防止 iOS 聚焦时自动放大 */
  .time-input{font-size:16px}
  .seg-row{gap:6px}
  .seg-del{width:34px;height:34px;flex:0 0 34px}
  .week button{padding:11px 0;font-size:14px}
  .chips button{padding:9px 14px;font-size:13px}
  .conv-item{padding:9px 10px}
  .conv-item .cname{font-size:13.5px}
  .toast{left:12px;right:12px;transform:translateY(20px);bottom:calc(16px + env(safe-area-inset-bottom));width:auto}
  .toast.on{transform:translateY(0)}
}
/* 超窄屏（小屏安卓 / 横屏） */
@media (max-width:380px){
  .clock{display:none}
  .grid{gap:8px}
  .amount{font-size:clamp(30px,12.5vw,52px)}
  .chips-row{gap:6px}
  .mchip b{font-size:13.5px}
}
/* 横屏矮屏：压缩纵向留白 */
@media (max-height:480px) and (orientation:landscape){
  .amount{font-size:clamp(30px,8vw,52px);margin:8px 0 2px}
  .timeline{margin:10px 0 2px}
  .wrap{padding-top:8px}
}
/* 触屏设备：去掉 hover 位移，避免点完“跳一下” */
@media (hover:none){
  .icon-btn:hover,.mchip:hover,.btn:hover{transform:none}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="topbar">

      <h1>工资秒表</h1>

      <div class="clock" id="clock">--:--:--</div>
      <button class="icon-btn mode-toggle" id="btnMode" title="切换暗夜 / 浅色">
        <span class="mode-ico" id="modeIcon">🌙</span><span class="mode-txt" id="modeText">暗夜</span>
      </button>
      <button class="icon-btn" id="btnRank" title="排行榜">🏆</button>
      <button class="icon-btn" id="btnSettings" title="设置（快捷键 S）">⚙</button>
    </div>
  </header>

  <section class="card hero">
    <div class="tabs" id="tabs">
      <button data-tab="today" class="active">今日</button>
      <button data-tab="month">本月</button>
      <button data-tab="year">本年</button>
    </div>
    <div class="amount"><span class="cur" id="heroCur">¥</span><span id="heroInt">0</span><span class="frac" id="heroFrac">.0000</span></div>
    <div class="hero-sub" id="heroSub">—</div>
    <div class="timeline">
      <div class="tl-track" id="tlTrack"></div>
      <div class="tl-labels"><span id="tlStart">--:--</span><span id="tlMid"></span><span id="tlEnd">--:--</span></div>
    </div>
    <div class="hero-foot">
      <div class="conv-chips" id="convChips"></div>
    </div>
  </section>

  <section class="grid">
    <div class="card stat">
      <h3>薪资单价</h3>
      <div class="kv big"><span>时薪</span><span id="sPerHour">—</span></div>
      <div class="kv"><span>每分钟</span><span id="sPerMin">—</span></div>
      <div class="kv"><span>每秒钟</span><span id="sPerSec">—</span></div>
      <div class="kv"><span>日薪</span><span id="sPerDay">—</span></div>
    </div>

    <div class="card stat">
      <h3>今日进度</h3>
      <div class="kv big"><span>已完成</span><span id="todayPct">—</span></div>
      <div class="bar"><i id="todayBar"></i></div>
      <div class="kv"><span>已工作</span><span id="todayWorked">—</span></div>
      <div class="kv"><span>应工作</span><span id="todayTotal">—</span></div>
    </div>

    <div class="card stat">
      <h3>本月进度</h3>
      <div class="kv big"><span>计薪日</span><span id="monthDays">—</span></div>
      <div class="bar alt"><i id="monthBar"></i></div>
      <div class="kv"><span>已过</span><span id="monthPassed">—</span></div>
      <div class="kv"><span>剩余</span><span id="monthLeft">—</span></div>
    </div>

    <div class="card stat">
      <h3>下一个节点</h3>
      <div class="kv big"><span id="nextLabel">—</span><span id="nextValue">—</span></div>
      <div class="kv"><span>日历</span><span id="dayName">—</span></div>
    </div>
  </section>

  <section class="chips-row">
    <button class="mchip" data-tab="today"><small>今日已赚</small><b id="cToday">—</b></button>
    <button class="mchip" data-tab="month"><small>本月已赚</small><b id="cMonth">—</b></button>
    <button class="mchip" data-tab="year"><small>本年已赚</small><b id="cYear">—</b></button>
  </section>
</div>

<div class="mask" id="mask"></div>
<aside class="drawer" id="drawer">
  <div class="drawer-head">
    <h2>设置</h2>
    <button class="icon-btn" id="btnClose" title="关闭">✕</button>
  </div>
  <div class="drawer-body">
    <div class="field">
      <label>月薪（税前 / 税后由你自己理解）</label>
      <div class="row">
        <input class="input" id="inMonthly" type="number" min="0" step="100" inputmode="decimal">
        <input class="input" id="inCurrency" type="text" maxlength="3" style="flex:0 0 64px;text-align:center" title="货币符号">
      </div>
    </div>

    <div class="field">
      <label>每天工作时段</label>
      <div id="segList"></div>
      <button class="btn" id="btnAddSeg">+ 添加工作时段</button>
    </div>

    <div class="field">
      <label>中午休息时间（不计薪，自动从工作时段中扣除）</label>
      <div id="breakList"></div>
      <button class="btn" id="btnAddBreak">+ 添加休息时段</button>
    </div>

    <div class="field">
      <label>每周工作日</label>
      <div class="week" id="weekRow">
        <button data-dow="1">一</button><button data-dow="2">二</button><button data-dow="3">三</button>
        <button data-dow="4">四</button><button data-dow="5">五</button><button data-dow="6">六</button>

      </div>
    </div>

      <select id="inHoliday">
        <option value="cn">按中国法定节假日（含调休补班）</option>
        <option value="none">不按节假日，只看每周工作日</option>
      </select>
    </div>

    <div class="field">
      <label>计薪口径</label>
      <select id="inBasis">
        <option value="actual">按当月实际计薪工作日</option>
        <option value="fixed">按 21.75 天 / 8 小时平均值</option>
        <option value="natural">按当月自然天数 24 小时连续分</option>
      </select>
    </div>

    <div class="field">
      <label>小数位</label>
      <div class="chips" id="decChips">
        <button data-dec="0">0</button><button data-dec="2">2</button>
        <button data-dec="3">3</button><button data-dec="4">4</button>
      </div>
    </div>

    <div class="field">
      <label>外观与提醒</label>
      <div class="kv" style="padding:0 0 9px"><span>配色主题</span></div>
      <div class="chips" id="paletteChips">
        <button data-palette="green">青绿</button>
        <button data-palette="red">红橙</button>
      </div>
      <div class="hint-muted">暗夜 / 浅色在主页右上角切换</div>
      <div style="height:9px"></div>
      <div class="switch"><span>上下班提示音</span><div class="tgl" id="tglSound"></div></div>
      <div class="switch"><span>换算显示</span><div class="tgl" id="tglConv"></div></div>
    </div>

    <div class="field">
      <label>排行榜</label>
      <div class="switch"><span>参与排行榜</span><div class="tgl" id="tglRank"></div></div>
      <div class="row" style="margin-top:10px">
        <input class="input" id="inNickname" type="text" maxlength="16" placeholder="昵称（默认：匿名用户）">
      </div>
      <div class="hint-muted" id="rankHint">开启后会把时薪、工时、地区上报到云端参与排名，不收集任何账号信息</div>
      <div class="row" style="margin-top:10px">
        <input class="input" id="inRankApi" type="text" placeholder="接口地址，如 https://xxx.workers.dev">
      </div>
      <button class="btn" id="btnRankPost" style="margin-top:10px">立即上报一次</button>
    </div>

    <div class="field">
      <label>换算物品（点击勾选，价格可改）</label>
      <div class="conv-list" id="convList"></div>
      <div class="row" style="margin-top:10px">
        <input class="input" id="inConvName" type="text" maxlength="8" placeholder="名称">
        <input class="input" id="inConvPrice" type="number" min="0.01" step="1" placeholder="单价" style="flex:0 0 88px">
        <button class="btn solid" id="btnAddConv" style="width:auto;white-space:nowrap;padding:9px 13px">添加</button>
      </div>
    </div>

    <div class="field">
      <label>自定义休息日</label>
      <textarea id="inCustomOff" placeholder="2027-01-01&#10;2027-05-04"></textarea>
    </div>

    <div class="field">
      <label>自定义上班日</label>
      <textarea id="inCustomWork" placeholder="2027-02-07"></textarea>
    </div>

    <div class="field">
      <button class="btn solid" id="btnReset">恢复默认设置</button>
    </div>
  </div>
</aside>

</aside>

function pad2(n){ return (n<10?'0':'')+n; }
function dateKey(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function isoDow(d){ var w=d.getDay(); return w===0?7:w; }
function hmToMin(s){ var p=String(s).split(':'); return ((parseInt(p[0],10)||0)*60)+(parseInt(p[1],10)||0); }
function minToHM(m){ m=Math.max(0,Math.round(m)); return pad2(Math.floor(m/60))+':'+pad2(m%60); }
function secOfDay(d){ return d.getHours()*3600+d.getMinutes()*60+d.getSeconds()+d.getMilliseconds()/1000; }

/* 归一化时段：同时接受 {start:'09:00',end:'18:00'} 字符串形式

   e 可以超过 1440，例如 18:00–02:00 => {s:1080, e:1560}。
   这样后续所有计算都只需在“可超过 24:00 的时间轴”上做偏移量算术。 */
function normSegments(segs){
  var out=[];
  (segs||[]).forEach(function(g){
    if(!g) return;
    var s, e;
    if(typeof g.s==='number' && typeof g.e==='number'){
      s=g.s; e=g.e;
    }else{
      s=hmToMin(g.start); e=hmToMin(g.end);
    }
    if(e===s) return;                  // 零长度时段，忽略
    if(e<s) e+=1440;                   // 跨午夜：结束时间顺延到次日
    out.push({s:s, e:e});
  });
  out.sort(function(a,b){ return a.s-b.s; });
  // 合并重叠/相接时段，避免重复计薪
  var merged=[];
  out.forEach(function(g){
    var last=merged[merged.length-1];
    if(last && g.s<=last.e){ last.e=Math.max(last.e, g.e); }
    else merged.push({s:g.s, e:g.e});
  });
  return merged;
}

/* 用休息时段切分工作时段：返回扣除休息后的有效工作区间。
   注意：工作时段可能延伸到次日（e 可 > 1440），所以休息时段也要
   同时考虑「当天」和「次日(+1440)」两个副本，否则像 00:00–00:30 的
   夜宵就无法命中 22:00–06:00 这段延长轴上的工作区间。 */
function subtractBreaks(workSegs, breakSegs){
  var work=normSegments(workSegs), brk=normSegments(breakSegs);
  if(!brk.length) return work;
  // 扩展休息到次日副本
  var brkX=[];
  brk.forEach(function(b){
    brkX.push({s:b.s, e:b.e});
    if(b.s+1440<=2880 && b.s<1440) brkX.push({s:b.s+1440, e:b.e+1440});
  });
  brkX.sort(function(a,b){ return a.s-b.s; });
  var out=[];
  work.forEach(function(w){
    var pieces=[{s:w.s, e:w.e}];
    brkX.forEach(function(b){
      var next=[];
      pieces.forEach(function(p){
        if(b.e<=p.s || b.s>=p.e){ next.push(p); return; }  // 无交集
        if(b.s>p.s) next.push({s:p.s, e:b.s});             // 左侧剩余
        if(b.e<p.e) next.push({s:b.e, e:p.e});             // 右侧剩余
      });
      pieces=next;
    });
    pieces.forEach(function(p){ if(p.e>p.s) out.push(p); });
  });
  out.sort(function(a,b){ return a.s-b.s; });
  // 切分后可能出现相邻片段，合并之
  var merged=[];
  out.forEach(function(g){
    var last=merged[merged.length-1];
    if(last && g.s<=last.e){ last.e=Math.max(last.e, g.e); }
    else merged.push({s:g.s, e:g.e});
  });
  return merged;
}

/* 一天的有效工作区间（已扣除午休等休息时段） */
function effectiveSegs(S){
  return subtractBreaks(S.segments, S.breaks||[]);
}
function dayWorkSeconds(segs){
  return normSegments(segs).reduce(function(a,g){ return a+(g.e-g.s)*60; },0);
}
/* 计算某天有效工作时长（秒），自动扣除休息时段 */
function effectiveDaySeconds(S){
  return effectiveSegs(S).reduce(function(a,g){ return a+(g.e-g.s)*60; },0);
}
/* 计算「今天已计薪多少秒」。
   baseSec 用于跨日：若传入大于 24h 的秒数（如次日 1:00 => 90000），
   表示当前时刻在“延长到次日”的时间轴上。 */
function elapsedSecondsInSegs(now, segs, baseSec){
  var list=normSegments(segs);
  var sec=(baseSec===undefined)?secOfDay(now):baseSec;
  var total=0;
  for(var i=0;i<list.length;i++){
    var s=list[i].s*60, e=list[i].e*60;
    if(sec>s) total+=Math.min(sec,e)-s;
  }
  return Math.max(0,total);
}
/* 时段在“延长轴”上的结束时刻（秒）。若跨了午夜，返回值 > 86400 */
function segsEndSec(segs){
  var list=normSegments(segs);
  if(!list.length) return 0;
  return list[list.length-1].e*60;
}
function segsStartSec(segs){
  var list=normSegments(segs);
  if(!list.length) return 0;
  return list[0].s*60;
}
/* 判断班次状态。
   baseSec：在“延长轴”上的当前秒数（跨日时 > 86400）。
   注意窗口是 [起始, 结束)，结束时刻按“已结束”处理。 */
function dayStatusOf(now, segs, baseSec){
  var list=normSegments(segs);
  var sec=(baseSec===undefined)?secOfDay(now):baseSec;
  if(!list.length) return 'none';
  var first=list[0].s*60, last=list[list.length-1].e*60;
  if(sec<first) return 'before';
  if(sec>=last) return 'after';
  for(var i=0;i<list.length;i++){
    if(sec>=list[i].s*60 && sec<list[i].e*60) return 'working';
  }
  return 'break';
}
function dayInfo(date, S){
  var key=dateKey(date), dow=isoDow(date);
  var work=(S.workdays||[]).indexOf(dow)>=0, name='', kind='';
  if(S.holidayMode==='cn'){
    var data=CN_HOLIDAYS[date.getFullYear()];
    if(data){
      if(data.off[key]){ work=false; name=data.off[key]; kind='holiday'; }
      else if(data.work[key]){ work=true; name=data.work[key]; kind='makeup'; }
    }
  }
  if((S.customOff||[]).indexOf(key)>=0){ work=false; name='自定义休息'; kind='custom'; }
  if((S.customWork||[]).indexOf(key)>=0){ work=true; if(!name) name='自定义上班'; kind='customWork'; }
  return {key:key, dow:dow, work:work, name:name, kind:kind, weekend:(dow>=6)};
}
function monthData(y, m, S){
  var days=new Date(y, m+1, 0).getDate();
  var natural=(S.payBasis==='natural');
  // 自然口径：不看工作时段，一天按 24 小时连续计
  var segs=natural?[{s:0,e:1440}]:effectiveSegs(S);
  var daySecs=natural?86400:effectiveDaySeconds(S);
  var grossSecs=natural?86400:dayWorkSeconds(S.segments);
  var workDays=0, list=[];
  for(var i=1;i<=days;i++){
    var d=new Date(y,m,i), info=dayInfo(d,S);
    // 注意：即使自然口径，也保留“按设置哪些天是工作日”的信息，
    // 用于「本月进度」卡片的计薪日/已过/剩余显示。
    list.push({date:d, day:i, info:info});
    if(info.work) workDays++;
  }
  var perDay, perSecond, perHour;
  if(natural){
    // 单价：月薪 ÷ 当月自然天数 ÷ 24h（不看工作日、不看工时）
    perDay = days>0 ? S.monthly/days : 0;
    perHour = perDay/24;
    perSecond = perHour/3600;
  }else if(S.payBasis==='fixed'){
    perHour=S.monthly/(21.75*8);
    perSecond=perHour/3600;
    perDay=perSecond*daySecs;
  }else{
    perDay=workDays>0?S.monthly/workDays:0;
    perSecond=daySecs>0?perDay/daySecs:0;
    perHour=perSecond*3600;
  }
  return {year:y, month:m, days:days, daySecs:daySecs, grossSecs:grossSecs,
          breakSecs:Math.max(0,grossSecs-daySecs),
          segs:segs, workDays:workDays, natural:natural,
          list:list, perDay:perDay, perSecond:perSecond, perHour:perHour};
}
function accruedSecondsInMonth(y, m, now, S, md){
  md=md||monthData(y,m,S);
  var ty=now.getFullYear(), tm=now.getMonth();
  if(y<ty || (y===ty && m<tm)){
    // 自然口径：已过去的整月 = 全部自然日跑满
    return md.natural ? md.days*86400 : md.workDays*md.daySecs;
  }
  if(y>ty || (y===ty && m>tm)) return 0;
  // 自然口径：按日历时间连续累计（含周末），进度即时间进度
  if(md.natural) return (now.getDate()-1)*86400 + secOfDay(now);
  var today=now.getDate(), sec=0;
  for(var i=0;i<md.list.length;i++){
    var it=md.list[i];
    if(!it.info.work) continue;
    if(it.day<today) sec+=md.daySecs;
    else if(it.day===today) sec+=earnedSecsToday(now,S,md);
  }
  return sec;
}
function nextWorkStart(now, S){
  var segs=effectiveSegs(S);
  if(!segs.length) return null;
  var h=Math.floor(segs[0].s/60), mi=segs[0].s%60;
  for(var i=1;i<=400;i++){
    var d=new Date(now.getFullYear(), now.getMonth(), now.getDate()+i, h, mi, 0, 0);
    if(dayInfo(d,S).work) return d;
  }
  return null;
}
/* 某天「已计薪多少秒」。班次归属于它的开始日：
   - 正常班次（不跨午夜）：就是当天走到哪算到哪
   - 跨午夜班次：当天时刻 >= 开始时间时，延长轴自然包含次日部分；
     当天时刻 < 开始时间时，说明正处于“昨天班次的尾巴”，需要接着算。 */
function earnedSecsToday(now, S, cur){
  var segs=cur.segs;
  if(!segs.length) return 0;
  // 自然口径：一天 24 小时连续计薪，今天已过多少秒就算多少
  if(cur.natural) return secOfDay(now);
  var curSec=secOfDay(now);
  var startSec=segsStartSec(segs);
  var prevDate=new Date(now.getFullYear(),now.getMonth(),now.getDate()-1);

  // 先看是否处在“昨天跨午夜班次”的尾巴里
  if(curSec<startSec && segsEndSec(segs)>86400 && dayInfo(prevDate,S).work){
    return elapsedSecondsInSegs(now, segs, 86400+curSec);
  }
  // 否则就是今天自己的班次
  if(!dayInfo(now,S).work) return 0;
  return elapsedSecondsInSegs(now, segs, curSec);
}
function computeAll(now, S, cache){
  var y=now.getFullYear(), m=now.getMonth();
  function md(yy,mm){
    var k=S._hash+'|'+yy+'-'+mm;
    if(!cache[k]) cache[k]=monthData(yy,mm,S);
    return cache[k];
  }
  var cur=md(y,m);
  var todayInfo=dayInfo(now,S);
  // 今天已计薪秒数（按班次归属计算，跨午夜时正确接续前一天）
  var todayElapsed=earnedSecsToday(now,S,cur);
  var todayEarned=cur.perSecond*todayElapsed;
  var monthAccrued=accruedSecondsInMonth(y,m,now,S,cur);
  var monthEarned=cur.perSecond*monthAccrued;
  var passed=0, remain=0;
  for(var j=0;j<cur.list.length;j++){
    var it=cur.list[j];
    if(!it.info.work) continue;
    if(it.day<=now.getDate()) passed++; else remain++;
  }
  // 本月进度：自然口径的“钱”按日历连续累计，但进度仍按设置的计薪工作日统计
  var monthPct;
  if(cur.natural){
    var doneDays=passed;
    if(todayInfo.work) doneDays=passed-1+Math.min(1,secOfDay(now)/86400);
    monthPct = cur.workDays>0 ? Math.min(1, doneDays/cur.workDays) : 0;
  }else{
    monthPct = (cur.workDays*cur.daySecs)>0 ? Math.min(1, monthAccrued/(cur.workDays*cur.daySecs)) : 0;
  }
  return {
    md:cur, todayInfo:todayInfo, todayElapsed:todayElapsed, todayEarned:todayEarned,
    monthEarned:monthEarned, monthAccrued:monthAccrued,
    monthTotalSecs:cur.workDays*cur.daySecs,
    passedWorkdays:passed, remainWorkdays:remain,
    perSecond:cur.perSecond, perHour:cur.perHour, perMinute:cur.perSecond*60,
    perDay:cur.perDay, daySecs:cur.daySecs,
    grossSecs:cur.grossSecs, breakSecs:cur.breakSecs,
    todayPct: cur.daySecs>0 ? Math.min(1, todayElapsed/cur.daySecs) : 0,
    monthPct: monthPct,
    _md:md
  };
}
/* 年累计 = 已过去各月的完整收入（每月为常量，缓存一次）+ 本月实时累计 */
function yearEarnedOf(now, S, d, cache){
  var y=now.getFullYear(), m=now.getMonth();
  var k='prev|'+S._hash+'|'+y+'-'+m;
  if(cache[k]===undefined){
    var sum=0;
    for(var i=0;i<m;i++){
      var mi=d._md(y,i);
      // 自然口径：整月收入 = 月薪（按自然天数已跑满）
      sum += mi.natural ? S.monthly : mi.perSecond*(mi.workDays*mi.daySecs);
    }
    cache[k]=sum;
  }
  return cache[k]+d.monthEarned;
}
function computeStatus(now, S, d){
  var segs=d.md.segs;
  var curSec=secOfDay(now);
  if(!segs.length) return {code:'rest',label:'未设置时段',nextLabel:'—',nextSec:null};

  // 自然口径：24 小时连续计薪，永不暂停
  if(d.md.natural){
    var left=86400-curSec;
    return {code:'working', label:'计薪中',
      nextLabel:'距零点重置', nextSec:left};
  }

  var startSec=segsStartSec(segs);
  var endSec=segsEndSec(segs);      // 可能 > 86400（跨午夜）
  var crosses=endSec>86400;
  var prevDate=new Date(now.getFullYear(),now.getMonth(),now.getDate()-1);
  var prevWorks=crosses && dayInfo(prevDate,S).work;

  // 处在“昨天跨午夜班次”的尾巴里：计薪中，距下班为剩余秒数
  if(curSec<startSec && prevWorks){
    var left=endSec-86400-curSec;
    if(left>0){
      return {code:'working', label:'计薪中',
        nextLabel:'距下班', nextSec:left};
    }
    // 夜班刚下，还没到今天上班时间 → 已下班
    return {code:'after', label:'已下班',
      nextLabel:'距上班', nextSec:startSec-curSec};
  }

  // 今天本身不上班
  if(!d.todayInfo.work){
    var nw1=nextWorkStart(now,S);
    return {code:'rest', label:'休息日',
      nextLabel:'距下次上班', nextSec: nw1?(nw1.getTime()-now.getTime())/1000:null};
  }

  var st=dayStatusOf(now,d.md.segs,curSec);
  if(st==='before'){
    return {code:'before', label:'未上班',
      nextLabel:'距上班', nextSec:startSec-curSec};
  }
  if(st==='working'){
    return {code:'working', label:'计薪中',
      nextLabel:'距下班', nextSec:endSec-curSec};
  }
  if(st==='break'){
    var nx=null;
    for(var i=0;i<segs.length;i++){ if(curSec<segs[i].s*60){ nx=segs[i]; break; } }
    // 判断当前是否落在某个休息时段里
    var curBreak=null, rawBreaks=normSegments(S.breaks||[]);
    for(var bi=0;bi<rawBreaks.length;bi++){
      if(curSec>=rawBreaks[bi].s*60 && curSec<=rawBreaks[bi].e*60){ curBreak=rawBreaks[bi]; break; }
    }
    return {code:'break', label: curBreak?'午休中':'休息中',
      nextLabel:'距继续计薪', nextSec: nx?nx.s*60-curSec:0};
  }
  var nw2=nextWorkStart(now,S);
  return {code:'after', label:'已下班',
    nextLabel:'距下次上班', nextSec: nw2?(nw2.getTime()-now.getTime())/1000:null};
}
function fmtDur(sec){
  sec=Math.max(0,Math.round(sec||0));
  var h=Math.floor(sec/3600), mi=Math.floor((sec%3600)/60), s=Math.floor(sec%60);
  // 计薪场景统一用 HH:MM:SS（24h 全天显示 24:00:00 比「1 天 0 小时」更直观）
  return pad2(h)+':'+pad2(mi)+':'+pad2(s);
}
function fmtMoney(v, dec){
  v=Number(v)||0;
  var neg=v<0; v=Math.abs(v);
  var s=v.toFixed(dec);
  var parts=s.split('.');
  var ip=parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return (neg?'-':'')+ip+(dec>0?'.'+parts[1]:'');
}

/* 采集设备特征，组合成指纹再 MD5。
   说明：这只是提高刷榜门槛，不是安全边界。 */
function collectFingerprint(){
  var parts=[];
  try{ parts.push(navigator.hardwareConcurrency||0); }catch(e){}
  try{ parts.push(screen.width+'x'+screen.height+'x'+(screen.colorDepth||0)); }catch(e){}
  try{ parts.push(Intl.DateTimeFormat().resolvedOptions().timeZone||''); }catch(e){}
  try{ parts.push(navigator.language||''); }catch(e){}
  try{ parts.push(navigator.platform||''); }catch(e){}
  try{ parts.push((navigator.userAgent||'').length); }catch(e){}
  try{ parts.push((navigator.userAgent||'').slice(-40)); }catch(e){}
  try{ parts.push(navigator.deviceMemory||0); }catch(e){}
  try{ parts.push(navigator.maxTouchPoints||0); }catch(e){}
  try{ parts.push('st:'+(navigator.storage&&navigator.storage.estimate?'1':'0')); }catch(e){}
  // WebGL 渲染器信息（GPU 型号，区分度很高）
  try{
    var cv=document.createElement('canvas');
    var gl=cv.getContext('webgl')||cv.getContext('experimental-webgl');
    if(gl){
      var dbg=gl.getExtension('WEBGL_debug_renderer_info');
      if(dbg){
        parts.push(gl.getParameter(dbg.UNMASKED_VENDOR_WEBGL)||'');
        parts.push(gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL)||'');
      }
    }
  }catch(e){}
  // 字体检测（粗略）
  try{
    var fonts=['Arial','Courier New','Georgia','Times New Roman','Verdana','Microsoft YaHei','SimSun'];
    var probe=document.createElement('span');
    probe.style.cssText='position:absolute;left:-9999px;font-size:72px;';
    probe.textContent='mmmmmmmmmmlli';
    document.body.appendChild(probe);
    var base=probe.offsetWidth;
    fonts.forEach(function(f){
      probe.style.fontFamily='"'+f+'",monospace';
      parts.push(f+':'+(probe.offsetWidth!==base?1:0));
    });
    document.body.removeChild(probe);
  }catch(e){}
  return parts.join('|');
}

/* 生成/读取设备码：优先用持久化的随机盐 + 指纹，保证同一设备稳定、清缓存后变成新身份 */
function getDeviceId(){
  var STORE='salary-ticker-device';
  var salt='';
  try{ salt=localStorage.getItem(STORE)||''; }catch(e){}
  if(!salt){
    salt=md5(String(Date.now())+Math.random()+String(navigator.userAgent));
    try{ localStorage.setItem(STORE, salt); }catch(e){}
  }
  // 16 位足够，且符合服务端校验规则
  return md5(salt+'|'+collectFingerprint()).slice(0,16);
}

function clone(o){ return JSON.parse(JSON.stringify(o)); }
function loadSettings(){
  var s=clone(DEFAULT_SETTINGS);
  var hadData=false;
  try{
    var raw=localStorage.getItem(KEY) || localStorage.getItem('salary-ticker-v1');
    if(raw){
      var o=JSON.parse(raw);
      hadData=true;
      Object.keys(s).forEach(function(k){ if(o[k]!==undefined) s[k]=o[k]; });
      // 旧版本迁移：把旧的单一奶茶设置搬到新的换算列表
      if(o.showMilk!==undefined){
        s.showConv = !!o.showMilk;
        if(Array.isArray(s.conversions) && o.milkPrice){
          var mt=s.conversions.filter(function(c){ return c.id==='milktea'; })[0];
          if(mt){ mt.price=Math.max(0.01, Number(o.milkPrice)||15); mt.on=!!o.showMilk; }
        }
      }
      // 关键：老数据没有 breaks 字段时，要补空数组而不是沿用默认午休，
      // 否则升级后计薪时长被悄悄改变（9h → 8h），时薪凭空变高。
      if(o.breaks===undefined) s.breaks=[];
      // 旧版单一 theme 字段迁移到 mode + palette 两个维度
      if(o.theme!==undefined && o.mode===undefined){
        if(o.theme==='light') s.mode='light';
        else s.mode='dark';
        s.palette = (o.theme==='red') ? 'red' : 'green';
      }
    }
  }catch(e){}
  if(!hadData) s.breaks=clone(DEFAULT_SETTINGS.breaks);
  if(!Array.isArray(s.segments) || !s.segments.length) s.segments=clone(DEFAULT_SETTINGS.segments);
  if(!Array.isArray(s.breaks)) s.breaks=clone(DEFAULT_SETTINGS.breaks);
  if(!Array.isArray(s.workdays)) s.workdays=[1,2,3,4,5];
  return normalize(s);
}
function normalize(s){
  s.monthly = Math.max(0, Number(s.monthly)||0);
  s.decimals = Math.min(4, Math.max(0, parseInt(s.decimals,10)||0));
  s.currency = String(s.currency||'¥').slice(0,3) || '¥';
  s.customOff = (s.customOff||[]).filter(Boolean);
  s.customWork = (s.customWork||[]).filter(Boolean);
  s.breaks = (s.breaks||[]).filter(Boolean);
  // 合并预设；自定义物品（id 不在预设里）必须保留，不能被重建过程丢掉
  var oldList = Array.isArray(s.conversions) ? s.conversions : [];
  var byId={};
  oldList.forEach(function(c){ if(c&&c.id) byId[c.id]=c; });
  var presetIds = {};
  var merged = CONV_PRESETS.map(function(p){
    presetIds[p.id]=true;
    var old=byId[p.id]||{};
    return {
      id:p.id,
      name: old.name || p.name,
      unit: old.unit || p.unit,
      emoji: old.emoji || p.emoji,
      price: Math.max(0.01, Number(old.price)||p.price),
      on: old.on!==undefined ? !!old.on : false
    };
  });
  oldList.forEach(function(c){
    if(!c||!c.id||presetIds[c.id]) return;
    merged.push({
      id:c.id,
      name:String(c.name||'自定义').slice(0,8),
      unit:String(c.unit||'个'),
      emoji:String(c.emoji||'✨'),
      price:Math.max(0.01, Number(c.price)||1),
      on:!!c.on
    });
  });
  s.conversions = merged;
  s._hash = JSON.stringify([s.monthly, s.payBasis, s.segments, s.breaks, s.workdays,
                            s.holidayMode, s.customOff, s.customWork]);
  return s;
}

/* 生成一行时间输入（工作时段 / 休息时段共用） */
var CLOCK_SVG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5l3.2 2"/></svg>';

function makeTimeField(listName, field, seg, i){
  var wrap=document.createElement('div');
  wrap.className='time-wrap';
  var inp=document.createElement('input');
  inp.type='time'; inp.className='time-input'; inp.value=seg[field];
  var btn=document.createElement('button');
  btn.type='button'; btn.className='time-btn'; btn.tabIndex=-1;
  btn.title='点击选择时间';
  btn.innerHTML=CLOCK_SVG;

  var commit=function(){
    if(!inp.value) return;
    if(settings[listName][i][field]===inp.value) return;
    settings[listName][i][field]=inp.value;
    var cur=settings[listName][i];
    if(cur && cur.start && cur.end && hmToMin(cur.start)===hmToMin(cur.end)){
      toast('开始与结束时间相同，该时段不计薪');
    }
    applySettings(true);
  };
  inp.addEventListener('change', commit);
  inp.addEventListener('blur', commit);

  // 点时钟按钮 = 打开原生时间选择器
  btn.addEventListener('click', function(e){
    e.preventDefault();
    e.stopPropagation();
    try{
      if(typeof inp.showPicker==='function'){ inp.showPicker(); return; }
    }catch(err){ /* 部分浏览器需要用户手势，回退到 focus */ }
    inp.focus();
    inp.click();
  });

  wrap.appendChild(inp);
  wrap.appendChild(btn);
  return wrap;
}

function makeTimeRow(listName, seg, i, opt){

  var del=document.createElement('button');
  del.className='seg-del'; del.textContent='✕';
  del.title = opt.optional ? '删除该休息时段' : '删除该工作时段';

/* 把“延长轴”上的分钟数转成用户看得懂的文字：
   <1440 显示 09:00；>=1440 显示 “次日 06:00”。 */
function minToLabel(m){
  m=Math.max(0,Math.round(m));
  if(m>=1440) return '次日 '+minToHM(m-1440);
  return minToHM(m);
}

/* 今日：按工作时段分段 */
function buildDayTimeline(track){
  track.className='tl-track';
  // 自然口径：不看工作时段，整天 00:00–24:00 一段
  if(settings.payBasis==='natural'){
    $('tlStart').textContent='00:00';
    $('tlEnd').textContent='24:00';
    $('tlMid').textContent='全天连续计薪 24h';
    var el=document.createElement('div');
    el.className='tl-seg';
    el.style.flex='1 1 0';
    var fill=document.createElement('div');
    fill.className='fill';
    el.appendChild(fill);
    el.dataset.idx=0;
    track.appendChild(el);
    return;
  }
  var raw=normSegments(settings.segments);
  var segs=effectiveSegs(settings);
  if(!raw.length){ $('tlStart').textContent='--:--'; $('tlEnd').textContent='--:--'; $('tlMid').textContent=''; return; }
  var from=raw[0].s, to=raw[raw.length-1].e;
  $('tlStart').textContent=minToLabel(from);
  $('tlEnd').textContent=minToLabel(to);
  // 中间标签：计薪时长 · 休息时长
  var paidMin=segs.reduce(function(a,g){ return a+(g.e-g.s); },0);
  var restMin=Math.max(0, (to-from)-paidMin);
  $('tlMid').textContent = paidMin>0
    ? ('计薪 '+(paidMin/60).toFixed(paidMin%60?1:0)+'h' + (restMin>0 ? ' · 休息 '+Math.round(restMin)+' 分钟' : ''))
    : '无计薪时段';
  if(!segs.length) return;
  var prevEnd=from;
  segs.forEach(function(g, idx){
    if(g.s>prevEnd){
      var gap=document.createElement('div');
      gap.className='tl-gap';
      gap.style.flex=(g.s-prevEnd)+' 1 0';
      gap.title='休息 '+minToHM(prevEnd)+'–'+minToHM(g.s)+'，不计薪';
      track.appendChild(gap);
    }
    var el=document.createElement('div');
    el.className='tl-seg';
    el.style.flex=(g.e-g.s)+' 1 0';
    el.title='计薪 '+minToHM(g.s)+'–'+minToHM(g.e);
    var fill=document.createElement('div');
    fill.className='fill';
    el.appendChild(fill);
    el.dataset.idx=idx;
    track.appendChild(el);
    prevEnd=g.e;
  });
  if(to>prevEnd){
    var tail=document.createElement('div');
    tail.className='tl-gap';
    tail.style.flex=(to-prevEnd)+' 1 0';
    tail.title='休息 '+minToLabel(prevEnd)+'–'+minToLabel(to)+'，不计薪';
    track.appendChild(tail);
  }
}

  var y=now.getFullYear(), totalDays=0;
  for(var i=0;i<12;i++) totalDays+=monthData(y,i,settings).workDays;
  $('tlMid').textContent='计薪 '+totalDays+' 天 · 12 个月';
  for(var m=0;m<12;m++){
    var el=document.createElement('div');
    el.className='tl-seg';
    el.style.flex='1 1 0';
    el.dataset.month=m;
    el.title=(m+1)+'月';
    var fill=document.createElement('div');
    fill.className='fill';
    el.appendChild(fill);
    track.appendChild(el);
  }
}

function paintTimeline(now, d, status){
  if(heroTab==='month') return paintMonthTimeline(now, d);
  if(heroTab==='year')  return paintYearTimeline(now, d);
  return paintDayTimeline(now, d);
}

function paintDayTimeline(now, d){
  var segs;
  if(d.md.natural){
    segs=[{s:0, e:1440}];
  }else{
    segs=d.md.segs;
    if(!segs.length) return;
  }
  var sec=secOfDay(now);
  var nodes=$('tlTrack').children;
  var segIdx=0;
  for(var i=0;i<nodes.length;i++){
    var n=nodes[i];
    if(n.classList.contains('tl-gap')) continue;
    // 防御：节点数与时段数不一致时跳过，避免越界崩溃
    if(segIdx>=segs.length) break;
    var g=segs[segIdx++];
    var fill=n.firstChild;
    if(!fill) continue;
    var s=g.s*60, e=g.e*60, pct=0;
    if(sec>=e) pct=100;
    else if(sec<=s) pct=0;
    else pct=((sec-s)/(e-s))*100;
    fill.style.width=pct.toFixed(2)+'%';
  }
}

/* 月视图：已过的日子填满，今天按当日进度，未来留空 */
function paintMonthTimeline(now, d){
  var today=now.getDate();
  var nodes=$('tlTrack').children;
  for(var i=0;i<nodes.length;i++){
    var n=nodes[i];
    if(n.classList.contains('tl-off')) continue;
    var day=Number(n.dataset.day);
    var fill=n.firstChild;
    if(!fill) continue;
    var pct=0;
    if(day<today) pct=100;
    else if(day===today) pct=d.todayPct*100;
    fill.style.width=pct.toFixed(2)+'%';
  }
}

/* 年视图：往月填满，本月按当月进度，未来留空 */
function paintYearTimeline(now, d){
  var curM=now.getMonth();
  var nodes=$('tlTrack').children;
  for(var i=0;i<nodes.length;i++){
    var n=nodes[i];
    var m=Number(n.dataset.month);
    var fill=n.firstChild;
    if(!fill) continue;
    var pct=0;
    if(m<curM) pct=100;
    else if(m===curM) pct=d.monthPct*100;
    fill.style.width=pct.toFixed(2)+'%';
  }
}

/* ---------------- 换算展示 ---------------- */
var convSig='', convNodes=[];
function paintConvs(amount){
  var on=settings.showConv ? settings.conversions.filter(function(c){ return c.on && c.price>0; }) : [];
  var sig=on.map(function(c){ return c.id+'|'+c.price+'|'+c.name+'|'+c.unit+'|'+c.emoji; }).join(';')+'|'+settings.currency;
  if(sig!==convSig){
    convSig=sig;
    var box=$('convChips');
    box.innerHTML='';
    convNodes=[];
    on.forEach(function(c){
      var el=document.createElement('div');
      el.className='chip';
      var ico=document.createElement('span');
      ico.className='ico'; ico.textContent=c.emoji||'•';
      var txt=document.createElement('span');
      el.appendChild(ico); el.appendChild(txt);
      box.appendChild(el);
      convNodes.push({el:el, txt:txt, c:c});
    });
  }
  for(var i=0;i<convNodes.length;i++){
    var n=convNodes[i], c=n.c;
    var qty=amount/c.price;
    var shown;
    if(qty>=1000) shown=Math.round(qty).toLocaleString('en-US');
    else if(qty>=100) shown=qty.toFixed(0);
    else if(qty>=10) shown=qty.toFixed(1);
    else shown=qty.toFixed(2);
    n.txt.innerHTML='≈ <b>'+shown+'</b> '+c.unit+' '+c.name;
  }
}

/* ---------------- render loop ---------------- */
function render(){
  var now=new Date();
  var d=computeAll(now, settings, cache);
  var st=computeStatus(now, settings, d);
  var cur=settings.currency;
  d.yearEarned = yearEarnedOf(now, settings, d, cache);

  // hero number
  var heroVal = heroTab==='month' ? d.monthEarned : (heroTab==='year' ? d.yearEarned : d.todayEarned);
  var dec=settings.decimals;
  var str=fmtMoney(heroVal, dec);
  var dot=str.lastIndexOf('.');
  var iP=str, fP='';
  if(dot>=0){ iP=str.slice(0,dot); fP=str.slice(dot); }
  $('heroCur').textContent=cur;
  $('heroInt').textContent=iP;
  $('heroFrac').textContent=fP;

  // 金额下方：今日已累计工时
  $('heroSub').innerHTML = '今日已累计 <b>'+fmtDur(d.todayElapsed)+'</b> 工时';

  // badge + clock
  var badge=$('statusBadge');
  badge.className='badge '+st.code;
  $('statusLabel').textContent=st.label;
  $('clock').textContent=pad2(now.getHours())+':'+pad2(now.getMinutes())+':'+pad2(now.getSeconds());

  // timeline
  paintTimeline(now, d, st);

  // 换算标签（可多个）
  paintConvs(heroVal);

  // stat cards
  $('sPerHour').textContent=cur+fmtMoney(d.perHour,2);
  $('sPerMin').textContent=cur+fmtMoney(d.perMinute,4);
  $('sPerSec').textContent=cur+fmtMoney(d.perSecond,4);
  $('sPerDay').textContent=cur+fmtMoney(d.perDay,2);

  $('todayPct').textContent=(d.todayPct*100).toFixed(1)+'%';
  $('todayBar').style.width=(d.todayPct*100).toFixed(2)+'%';
  $('todayWorked').textContent=fmtDur(d.todayElapsed);
  $('todayTotal').textContent=fmtDur(d.daySecs);

  // 自然口径下“计薪日”就是当月天数
  $('monthDays').textContent=d.md.workDays+' 天';
  $('monthBar').style.width=(d.monthPct*100).toFixed(2)+'%';
  $('monthPassed').textContent=d.passedWorkdays+' / '+d.md.workDays;
  $('monthLeft').textContent=d.remainWorkdays+' 天';

  $('nextLabel').textContent=st.nextLabel;
  $('nextValue').textContent=(st.nextSec===null||st.nextSec===undefined)?'—':fmtDur(st.nextSec);
  $('dayName').textContent=(function(){
    var w=['日','一','二','三','四','五','六'][now.getDay()];
    var extra=d.todayInfo.name?(' · '+d.todayInfo.name):'';
    return w===undefined?'—':('周'+w+extra);
  })();

  // 底部三个汇总卡片
  $('cToday').textContent=cur+fmtMoney(d.todayEarned,2);
  $('cMonth').textContent=cur+fmtMoney(d.monthEarned,2);
  $('cYear').textContent=cur+fmtMoney(d.yearEarned,2);

  document.title = cur+fmtMoney(heroVal,2)+' · 工资秒表';

  // 到点提示音
  if(lastStatus!==null && lastStatus!==st.code){
    if(st.code==='after' || st.code==='working') beep(st.code==='after');
  }
  lastStatus=st.code;

  // 累积工时/已赚（供排行榜使用）
  accumulateStats(d, now, st.code);

  requestAnimationFrame(render);
}

function beep(end){
  if(!settings.sound) return;
  try{
    audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    var t=audioCtx.currentTime;
    [0, 0.16].forEach(function(off, i){
      var o=audioCtx.createOscillator(), g=audioCtx.createGain();
      o.type='sine';
      o.frequency.value = end ? (660 - i*120) : (520 + i*160);
      g.gain.setValueAtTime(0.0001, t+off);
      g.gain.exponentialRampToValueAtTime(0.12, t+off+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t+off+0.26);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(t+off); o.stop(t+off+0.3);
    });
  }catch(e){}
}

  var startMin=last?Math.min(23*60, last.e+60):9*60;
  var endMin=Math.min(24*60-1, startMin+240);
  settings.segments.push({start:minToHM(startMin), end:minToHM(endMin)});

});

$('btnAddBreak').addEventListener('click', function(){
  var brk=normSegments(settings.breaks);
  // 默认给一个 12:00-13:00；之后的接在上一段之后
  var startMin, endMin;
  if(!brk.length){ startMin=12*60; endMin=13*60; }
  else {
    var last=brk[brk.length-1];
    startMin=Math.min(23*60, last.e+180);
    endMin=Math.min(24*60-1, startMin+60);
  }
  settings.breaks.push({start:minToHM(startMin), end:minToHM(endMin)});
  applySettings(true, true);
  toast('已添加休息 '+minToHM(startMin)+' – '+minToHM(endMin)+'，该时段不计薪');
});

/* ---------------- 排行榜 ---------------- */
var rankState = {
  board: 'per_hour',
  scope: 'global',
  country: '',
  loading: false,
  lastPost: 0,
  myDeviceId: '',
};

/* 规范化接口地址（去掉末尾斜杠） */
function rankBase(){
  var api=(settings.rankApi||'').trim().replace(/\/+$/,'');
  return api;
}

function openRank(){
  $('rankDrawer').classList.add('on');
  $('mask').classList.add('on');
  loadRank();
}
function closeRank(){
  $('rankDrawer').classList.remove('on');
  $('mask').classList.remove('on');
}

/* 渲染榜单列表 */
function renderRank(data, err){
  var box=$('rankList');
  box.innerHTML='';
  var foot=$('rankFoot');

  if(err){
    box.innerHTML='<div class="rank-empty">加载失败<br>'+escapeHtml(err)+'</div>';
    foot.textContent='';
    return;
  }
  if(!data || !data.list || !data.list.length){
    box.innerHTML='<div class="rank-empty">还没有人上榜<br>去设置里开启排行榜吧</div>';
    foot.textContent='';
    return;
  }

  var myId=rankState.myDeviceId;
  data.list.forEach(function(it){
    var row=document.createElement('div');
    row.className='rank-row';

    var no=document.createElement('div');
    no.className='rank-no'+(it.rank===1?' top1':it.rank===2?' top2':it.rank===3?' top3':'');
    no.textContent = it.rank===1?'🥇':it.rank===2?'🥈':it.rank===3?'🥉':it.rank;

    var info=document.createElement('div');
    info.className='rank-info';
    var name=document.createElement('div');
    name.className='rank-name';
    name.textContent=it.nickname || '匿名用户';
    var meta=document.createElement('div');
    meta.className='rank-meta';
    var loc=it.countryName || it.country;
    if(it.city) loc += ' · ' + it.city;
    meta.textContent=loc;
    info.appendChild(name); info.appendChild(meta);

    var val=document.createElement('div');
    val.className='rank-val';
    var b=document.createElement('b');
    var small=document.createElement('small');
    if(rankState.board==='per_hour'){
      b.textContent=settings.currency+fmtMoney(it.perHour,2);
      small.textContent='时薪';
    }else if(rankState.board==='work_hours'){
      b.textContent=it.workHours.toFixed(0)+'h';
      small.textContent='累计工时';
    }else{
      b.textContent=settings.currency+fmtMoney(it.earned,0);
      small.textContent='累计已赚';
    }
    val.appendChild(b); val.appendChild(small);

    row.appendChild(no); row.appendChild(info); row.appendChild(val);
    box.appendChild(row);
  });

  foot.textContent = (data.scope==='country' ? '本地区' : '全球') + '共 ' + data.list.length + ' 人上榜';
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

/* 拉取榜单 */
function loadRank(){
  var base=rankBase();
  if(!base){
    renderRank(null, '未配置排行榜接口地址，请在设置里填写');
    return;
  }
  var url=base + '/api/rank?board=' + encodeURIComponent(rankState.board)
        + '&scope=' + encodeURIComponent(rankState.scope)
        + '&limit=50';
  if(rankState.scope==='country'){
    url += '&country=' + encodeURIComponent(rankState.country || 'CN');
  }
  $('rankList').innerHTML='<div class="rank-empty">正在加载…</div>';

  var done=false;
  var timer=setTimeout(function(){
    if(!done){ renderRank(null, '请求超时，请检查网络或接口地址'); }
  }, 10000);

  fetch(url, { method:'GET' }).then(function(r){
    if(!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  }).then(function(data){
    done=true; clearTimeout(timer);
    renderRank(data, null);
  }).catch(function(e){
    done=true; clearTimeout(timer);
    renderRank(null, '网络错误：' + (e && e.message ? e.message : e));
  });
}

/* 上报自己的数据 */
function postRank(auto){
  var base=rankBase();
  if(!base){ if(!auto) toast('请先在设置里填写排行榜接口地址'); return; }
  if(!settings.rankEnabled){ if(!auto) toast('请先开启「参与排行榜」'); return; }

  var now=new Date();
  var d=computeAll(now, settings, cache);
  var id = rankState.myDeviceId || getDeviceId();
  rankState.myDeviceId = id;

  var payload={
    deviceId: id,
    nickname: (settings.nickname||'').trim() || '匿名用户',
    perHour: d.perHour,
    perSecond: d.perSecond,
    monthly: settings.monthly,
    workHours: settings.totalWorkHours || 0,
    earned: settings.totalEarned || 0,
    payBasis: settings.payBasis,
    currency: settings.currency
  };

  if(!auto) toast('正在上报…');

  fetch(base + '/api/score', {
    method:'POST',
    headers:{ 'Content-Type':'application/json' },
    body: JSON.stringify(payload)
  }).then(function(r){
    return r.json().then(function(j){ return {status:r.status, body:j}; });
  }).then(function(res){
    if(res.status===429){
      if(!auto) toast('上报太频繁，请稍后再试');
      return;
    }
    if(res.status!==200 || !res.body.ok){
      if(!auto) toast('上报失败：' + (res.body.error||'未知错误'));
      return;
    }
    rankState.country = res.body.country || '';
    rankState.lastPost = Date.now();
    if(!auto){
      var rk=res.body.rank;
      toast(rk ? ('上报成功，时薪排名第 ' + rk.rank + ' / ' + rk.total) : '上报成功');
    }
  }).catch(function(e){
    if(!auto) toast('上报失败：' + (e && e.message ? e.message : '网络错误'));
  });
}

/* 累积工时/已赚（每次 render 时更新，用于工时榜和金额榜）。
   说明：只在「计薪中」状态累加，午休/下班不涨，和主界面数字口径一致。 */
var lastAccumTs = 0;
function accumulateStats(d, now, statusCode){
  var ts = now.getTime();
  if(!lastAccumTs){ lastAccumTs = ts; return; }
  var delta = (ts - lastAccumTs) / 1000;
  if(delta <= 0 || delta > 60){ lastAccumTs = ts; return; }   // 跳过异常间隔（切后台、休眠等）
  if(statusCode === 'working'){
    settings.totalWorkHours = (settings.totalWorkHours||0) + delta/3600;
    settings.totalEarned = (settings.totalEarned||0) + d.perSecond*delta;
  }
  lastAccumTs = ts;
}
